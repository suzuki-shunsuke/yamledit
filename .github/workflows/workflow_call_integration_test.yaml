---
name: integration test
on:
  workflow_call:
jobs:
  integration-test:
    # Go modules are downloaded by the gomodule job in the caller workflow
    permissions:
      contents: read
    timeout-minutes: 20
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        runs-on:
          - ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules
        uses: suzuki-shunsuke/download-go-module-action/restore@v0.0.10

      - run: |
          go install -ldflags "-X main.version=v3.0.0-local -X main.commit=$GITHUB_SHA -X main.date=$(date +"%Y-%m-%dT%H:%M:%SZ%:z" | tr -d '+')" ./cmd/yamledit
      - run: yamledit -v
      - run: yamledit new foo
      - run: test -f .yamledit/foo/ruleset.yaml
      - run: test -f .yamledit/foo/normal/test.yaml
      - run: test -f .yamledit/foo/normal/result.yaml
      - run: yamledit new test
      - run: yamledit new foo
      - run: yamledit new test
      - run: yamledit new zoo
      - run: test -f .yamledit/zoo/ruleset.yaml
      - run: test -f .yamledit/zoo/normal/test.yaml
      - run: test -f .yamledit/zoo/normal/result.yaml
      - run: yamledit new test
